[project]
name = "videocreator"
dynamic = ["version"]
description = "Video Creator V2 — AI Multi-Studio Desktop Platform"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "pywebview>=5.3.2",
    "platformdirs>=4.3.6",
    "pydantic>=2.9.2",
    "httpx>=0.27.2",
    "tomli-w>=1.1.0",
    "google-genai>=3.3.0",
    "anthropic>=2.8.0",
    "python-telegram-bot>=22.0",
    "boto3>=1.44.2",
    "apscheduler>=3.10,<4.0",
    "tzdata>=2024.2",
    "yt-dlp==2026.10.26",
    "cryptography>=43.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
]

[project.scripts]
videocreator = "videocreator.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/videocreator/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/videocreator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "local: local tests running against real SQLite/FFmpeg without external network calls",
    "live: live integration tests calling real external APIs or CLIs",
]
