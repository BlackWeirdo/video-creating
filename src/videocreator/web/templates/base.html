<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Video Creator{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <a href="/">Video Creator</a>
      <span class="badge">{{ settings.role }}</span>
    </div>
    <nav class="nav">
      <a href="/" class="{% if page == 'home' %}active{% endif %}">Trang chủ</a>
      <a href="/products" class="{% if page == 'products' %}active{% endif %}">Sản phẩm</a>
      <a href="/footage" class="{% if page == 'footage' %}active{% endif %}">Footage</a>
      <a href="/shots" class="{% if page == 'shots' %}active{% endif %}">Kho shot</a>
      <a href="/videos" class="{% if page == 'videos' %}active{% endif %}">Video</a>
      <a href="/approval" class="{% if page == 'approval' %}active{% endif %}">Chờ duyệt</a>
      <a href="/schedule" class="{% if page == 'schedule' %}active{% endif %}">Lịch đăng</a>
      <a href="/trends" class="{% if page == 'trends' %}active{% endif %}">Xu hướng</a>
      <a href="/studio" class="{% if page == 'studio' %}active{% endif %}">Studio</a>
      <a href="/broll" class="{% if page == 'broll' %}active{% endif %}">Cảnh phụ</a>
      <a href="/performance" class="{% if page == 'performance' %}active{% endif %}">Hiệu quả</a>
      <a href="/assets" class="{% if page == 'assets' %}active{% endif %}">Tài nguyên</a>
      <a href="/accounts" class="{% if page == 'accounts' %}active{% endif %}">Tài khoản</a>
      <a href="/settings" class="{% if page == 'settings' %}active{% endif %}">Settings</a>
    </nav>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <span>Video Creator v{{ version }} — Nội bộ trang sức bạc thủ công</span>
  </footer>
</body>
</html>
