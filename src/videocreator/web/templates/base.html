<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Video Creator{% endblock %}</title>
  <script>
    // Runs before first paint so the page never flashes the wrong theme:
    // the saved choice wins, otherwise the operating system preference.
    (function () {
      var theme = null;
      try { theme = localStorage.getItem('vc-theme'); } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <a href="/">Video Creator</a>
      <span class="badge">{{ settings.role }}</span>
    </div>
    <nav class="nav">
      <a href="/" class="{% if page == 'home' %}active{% endif %}">Trang chủ</a>
      <a href="/products" class="{% if page == 'products' %}active{% endif %}">Sản phẩm</a>
      <a href="/footage" class="{% if page == 'footage' %}active{% endif %}">Footage</a>
      <a href="/shots" class="{% if page == 'shots' %}active{% endif %}">Kho shot</a>
      <a href="/videos" class="{% if page == 'videos' %}active{% endif %}">Video</a>
      <a href="/approval" class="{% if page == 'approval' %}active{% endif %}">Chờ duyệt</a>
      <a href="/schedule" class="{% if page == 'schedule' %}active{% endif %}">Lịch đăng</a>
      <a href="/trends" class="{% if page == 'trends' %}active{% endif %}">Xu hướng</a>
      <a href="/studio" class="{% if page == 'studio' %}active{% endif %}">Studio</a>
      <a href="/broll" class="{% if page == 'broll' %}active{% endif %}">Cảnh phụ</a>
      <a href="/performance" class="{% if page == 'performance' %}active{% endif %}">Hiệu quả</a>
      <a href="/assets" class="{% if page == 'assets' %}active{% endif %}">Tài nguyên</a>
      <a href="/accounts" class="{% if page == 'accounts' %}active{% endif %}">Tài khoản</a>
      <a href="/settings" class="{% if page == 'settings' %}active{% endif %}">Settings</a>
    </nav>
    <button type="button" class="icon-btn theme-toggle" id="theme-toggle" aria-label="Giao diện tối" aria-pressed="false">
      <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 7 7 0 1 0 20 14.5z"/></svg>
      <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <span>Video Creator v{{ version }} — Nội bộ trang sức bạc thủ công</span>
  </footer>
</body>
</html>
