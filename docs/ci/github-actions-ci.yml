name: Video Creator V2 CI

on:
  push:
    branches: [main, v2, ui-redesign, "refactor/**", "feat/**", "fix/**"]
  pull_request:
    branches: [main, v2]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-verify:
    name: Windows Python 3.11 + Next.js 15 + FFmpeg
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        shell: pwsh
        run: choco install ffmpeg --no-progress -y

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web-next/package-lock.json

      - name: Setup uv and Python 3.11
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Sync Python dependencies from uv.lock
        shell: pwsh
        run: uv sync --frozen --extra dev

      - name: Run Ruff static analysis (F821, F401, E9)
        shell: pwsh
        run: uvx ruff check src tests --select E9,F63,F7,F82,F401

      - name: Frontend lint, unit tests, and standalone build
        working-directory: web-next
        shell: pwsh
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Run fast architecture & local unit/API test suite
        shell: pwsh
        run: .\.venv\Scripts\pytest.exe -m "local and not slow" -q

      - name: Run Next.js standalone E2E suite
        shell: pwsh
        run: .\.venv\Scripts\pytest.exe tests/test_v2_phase05_nextjs_e2e.py -q
